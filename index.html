<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bóveda Neural · Escape Room de IA</title>
  <meta name="description" content="Escape room educativo sobre Big Data, Machine Learning y Prompt Engineering para 5.º año, Ciclo Orientado en Economía." />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- ===== SELECTOR DE IDIOMA (siempre visible, arriba a la derecha) ===== -->
  <div class="lang" id="lang">
    <button class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false" data-i18n-title="lang.label">🌐 <span id="lang-current">ES</span> ▾</button>
    <div class="lang-menu" id="lang-menu" role="menu"></div>
  </div>

  <!-- ===== HUD ===== -->
  <header id="hud" class="hud hidden">
    <div class="hud-left">
      <img src="assets/img/logo.svg" alt="" class="hud-logo" />
      <div>
        <div class="hud-label" data-i18n="hud.agent">Agente</div>
        <div id="hud-name" class="hud-name">—</div>
      </div>
    </div>
    <div class="hud-keys" id="hud-keys" aria-label="Palabras clave obtenidas"></div>
    <div class="hud-right">
      <div class="hud-timer" id="hud-timer" data-i18n-title="hud.timer">60:00</div>
      <button class="icon-btn" id="btn-sound" data-i18n-title="hud.sound">🔊</button>
      <button class="icon-btn" id="btn-menu" data-i18n-title="hud.menu">⚙️</button>
    </div>
  </header>

  <main id="app">
    <!-- ===== BIENVENIDA ===== -->
    <section id="screen-welcome" class="screen active">
      <div class="welcome">
        <img src="assets/img/logo.svg" alt="" class="welcome-logo" />
        <h1 class="title" data-i18n="w.title">BÓVEDA <span>NEURAL</span></h1>
        <p class="subtitle" data-i18n="w.subtitle">Escape del Banco Austral de Datos</p>

        <div class="story card">
          <img src="assets/img/aria.svg" alt="ARIA" class="aria-big" />
          <div data-i18n="w.story"></div>
          </div>
        </div>

        <form id="form-name" class="card name-card" autocomplete="off">
          <label for="input-name" data-i18n="w.nameLabel"></label>
          <div class="name-row">
            <input id="input-name" type="text" maxlength="40" data-i18n-ph="w.namePh" required />
            <button type="submit" class="btn btn-primary" data-i18n="w.enter"></button>
          </div>
          <small data-i18n="w.nameHelp"></small>
        </form>

        <div id="resume-box" class="card resume hidden">
          <p id="resume-text"></p>
          <div class="row">
            <button class="btn btn-primary" id="btn-resume" data-i18n="w.continue"></button>
            <button class="btn btn-ghost" id="btn-new" data-i18n="w.new"></button>
          </div>
        </div>

        <ul class="rules" data-i18n="w.rules"></ul>
      </div>
    </section>

    <!-- ===== MAPA ===== -->
    <section id="screen-map" class="screen">
      <div class="map-head">
        <img src="assets/img/aria.svg" alt="" class="aria-small" />
        <div class="speech" id="map-speech"></div>
      </div>
      <div class="map-grid" id="map-grid"></div>
      <div class="vault-tile" id="vault-tile">
        <img src="assets/img/boveda.svg" alt="" />
        <div>
          <h3 data-i18n="map.vaultTitle"></h3>
          <p id="vault-status"></p>
        </div>
        <button class="btn btn-gold" id="btn-vault" disabled data-i18n="map.vaultBtn"></button>
      </div>
    </section>

    <!-- ===== SALA ===== -->
    <section id="screen-room" class="screen">
      <div class="room-head">
        <img id="room-icon" src="" alt="" />
        <div>
          <div class="room-kicker" id="room-kicker"></div>
          <h2 id="room-title"></h2>
        </div>
        <div class="room-actions">
          <button class="btn btn-ghost small" id="btn-hint"></button>
          <button class="btn btn-ghost small" id="btn-back-map" data-i18n="room.map"></button>
        </div>
      </div>
      <div class="progress"><div class="progress-bar" id="room-progress"></div></div>
      <div id="room-body" class="room-body"></div>
    </section>

    <!-- ===== BÓVEDA FINAL ===== -->
    <section id="screen-final" class="screen">
      <div class="final card">
        <img src="assets/img/boveda.svg" alt="" class="final-img" id="final-img" />
        <h2 data-i18n="f.title"></h2>
        <p data-i18n="f.text"></p>
        <form id="form-final" class="final-inputs" autocomplete="off"></form>
        <div class="row center">
          <button class="btn btn-ghost" id="btn-final-back" data-i18n="f.back"></button>
          <button class="btn btn-gold" id="btn-final-open" data-i18n="f.open"></button>
        </div>
        <p class="feedback" id="final-feedback"></p>
      </div>
    </section>

    <!-- ===== CERTIFICADO ===== -->
    <section id="screen-cert" class="screen">
      <div class="cert-wrap">
        <h2 class="center" data-i18n="c.title"></h2>
        <p class="center" id="cert-summary"></p>
        <canvas id="cert-canvas" width="1600" height="1130" aria-label="Certificado"></canvas>
        <div class="row center">
          <button class="btn btn-gold" id="btn-cert-download" data-i18n="c.download"></button>
          <button class="btn btn-primary" id="btn-cert-print" data-i18n="c.print"></button>
          <button class="btn btn-ghost" id="btn-cert-new" data-i18n="c.new"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== MODAL ===== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box">
      <div id="modal-content"></div>
      <div class="row center" id="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <footer class="foot" id="foot"></footer>

  <script src="js/data.js"></script>
  <script src="js/data.fr.js"></script>
  <script src="js/data.en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/certificate.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
